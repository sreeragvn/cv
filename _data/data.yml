career-profile:
    title: Summary
    summary: |
      Data Scientist delivering end-to-end machine-learning projects for industrial clients, working
      from sensor, telemetry, manufacturing, and inspection data across high-precision optics, gimbal
      systems, and weather forecasting, from requirements and proposal writing through model
      development, validation, and handover. Combines
      three years of applied ML in forecasting, predictive maintenance, and computer vision with four
      years of client-facing technical product management and a mechanical-engineering background.
      Co-author of an **ICLR 2026** paper.

education:
    title: Education
    info:
      - degree: M.Sc. in Computational Sciences in Engineering
        university: TU Braunschweig
        time: Oct 2021 - May 2024
        details: |
          - Final grade 1.4 (German scale, 1.0 = best), top 4% of the graduating class;
            Deutschlandstipendium recipient.
          - Focus: pattern recognition, scientific machine learning, uncertainty quantification,
            numerical methods, and continuous optimization for data science, supported by advanced
            programming and algorithms coursework.
      - degree: B.Tech in Mechanical Engineering
        university: University of Kerala
        time: Aug 2012 - Apr 2016
        details: |
          - First-author Materials Today: Proceedings publication on controlling flow separation in
            rocket nozzles, developed from a bachelor's thesis at ISRO.

experiences:
    title: Professional Experience
    info:
      # Accuracy constraints mirrored from the PDF:
      #  - "deployed" is used ONLY for the DLR Stade CFRP prototype; the optics
      #    system is delivered, not running in the client's live workflow.
      #  - Both aviation-adjacent projects serve an aviation client. Role differs:
      #    sole contributor on the Stade leak work, ML-topic contributor only on
      #    the D-scan project — so nothing there implies project-level ownership.
      #  - Clients are described by sector, never named.
      - role: Data Scientist
        time: Oct 2024 - Present
        company: DLR — Deutsches Zentrum für Luft- und Raumfahrt, Jena, Germany
        details: |
            - Technical lead on three industry-funded client projects in high-precision optics,
              gimbal systems, and weather forecasting, owning requirements, proposals, model development,
              and presentations to client management; ML contributor on a fourth project for an
              aviation client.
            - Built and delivered the client's first automated process-planning system for
              high-precision lens manufacturing: occurrence prediction reaches 0.92 macro balanced
              accuracy and 0.85 macro F1 across all 26 learned steps under nested five-fold
              cross-validation.
            - Built the cost-estimation pipeline from JSON/SVG specifications and KAD routing data:
              scanned 8,163 raw JSON files, engineered 236 validated features for 909 lens sides from
              458 finished lenses, and achieved approximately 10% pooled out-of-fold median absolute
              percentage error under grouped cross-validation.
            - Ran a structured architecture selection for a gimbal manufacturer's telemetry
              forecasting, benchmarking four candidates from LSTM to recent transformer variants
              against out-of-sample error; time-series anomaly detection for a weather-forecasting
              client is in progress.
            - Built the computer vision model predicting the residual compressive strength of
              impact-damaged aircraft composites to within 5% from ultrasonic D-scans for an aviation
              client, demonstrating a nondestructive alternative to coupon testing.
            - Deliver client work as tested, reproducible software through config-driven experiments,
              tracked runs, dataset fingerprinting, seeded splits, 400+ automated tests, and enforced
              lint and type checks.
            - Design and run recurring hands-on deep-learning workshops for 50+ colleagues across DLR
              institutes; supervise student projects.
        # Verified against TSF/results/*/metrics.csv if a figure is ever wanted here:
        # PatchTST OVERALL MAE 0.160 vs LSTM 0.316 = 49% lower, on Base roll/pitch/yaw.
        # Only four models have saved results; iTransformer produced none.

      - role: Machine Learning Intern
        time: Oct 2023 - May 2024
        company: Porsche AG, Weissach, Germany
        details: |
            - Delivered a context-aware infotainment recommender with Porsche's in-car UX and engineering
              teams, achieving >84% top-3 accuracy and recall after fine-tuning for previously unseen
              drivers; published at ACM AutomotiveUI '24 (Best Work-in-Progress Award).
            - Analyzed driver interactions across time, route type, and driving conditions to inform UI
              simplification, adapting SimCLR with custom augmentations to learn from sparse data.

      - role: Machine Learning Intern
        time: Apr 2023 - Sep 2023
        company: DLR — Deutsches Zentrum für Luft- und Raumfahrt, Stade, Germany
        details: |
            - Sole contributor on an aviation-client project: built and deployed an internal DLR
              prototype locating vacuum-bag leaks in aircraft-composite autoclave manufacturing —
              previously a manual expert search that delayed production — from sensor-data acquisition
              through model deployment.
            - Extended the model from single- to multi-leak localization with per-prediction
              uncertainty estimates, so operators know when to trust the result; improved localization
              accuracy by >12% against the unconstrained architecture by encoding sensor-layout geometry.

      - role: Associate Product Manager — Technical
        time: Sep 2017 - Aug 2021
        company: Kalkitech, Kochi, India
        details: |
            - Led cross-functional delivery of the Eltrix asset-management platform across 15+
              multi-site client accounts in Europe, Asia, and the Middle East, translating
              plant-operator requirements into product specifications and coordinating engineering,
              business, and client teams from discovery through delivery.
            - Built thermodynamic and statistical degradation models from industrial sensor data and
              generated maintenance schedules, helping thermal power-plant clients move from reactive
              repair to planned preventive maintenance.
            - Applied ASME, EPRI, and HEI standards to build plant-performance models and diagnostics,
              and delivered Grafana and Power BI dashboards giving operators and managers near-real-time
              KPI visibility across sites.

      - role: Earlier
        time: 2016 - 2017
        company: Tata Consultancy Services · Ernst & Young, India
        details: |
            - Assistant System Engineer Trainee at Tata Consultancy Services (2017), contributing to
              conversation design for an office-assistant application; Data Analyst at Ernst & Young (2016).

# Public code only. Client work (optics, gimbal, weather) is deliberately absent:
# it cannot be linked, and describing unlinkable work here adds nothing the CV
# does not already say.
projects:
    title: Open Source & Public Code
    assignments:
      - title: "TEDM — Time Series Forecasting with Elucidated Diffusion Models"
        link: https://gitlab.com/dlr-dw/tedm
        tagline: >
          Official implementation of the ICLR 2026 paper. Diffusion-based multivariate forecasting,
          evaluated across eleven public benchmark datasets.

      - title: "local-VQA-tool — on-device visual question answering"
        link: https://github.com/sreeragvn/local-VQA-tool
        tagline: >
          Open-weight vision-language models running entirely on CPU. Every backend asserts a loopback
          endpoint and refuses to start otherwise, so images never leave the machine.

