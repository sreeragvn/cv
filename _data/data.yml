career-profile:
    title: Summary
    summary: |
      Machine learning engineer with three years of applied machine learning in classification,
      regression, time-series forecasting and anomaly detection on manufacturing and sensor data,
      preceded by four years in client-facing technical product management. I focus on applying
      machine learning solutions across various domains to solve real-world problems.

education:
    title: Education
    info:
      - degree: M.Sc. in Computational Sciences in Engineering
        university: TU Braunschweig
        time: Oct 2021 - May 2024
        details: |
          - Final grade 1.4 (German scale, 1.0 = best), top 4% of the class; Deutschlandstipendium
            recipient. Focus: pattern recognition, scientific machine learning, uncertainty
            quantification, optimization.
      - degree: B.Tech in Mechanical Engineering
        university: University of Kerala
        time: Aug 2012 - Apr 2016
        details: |
          - Bachelor's thesis at ISRO on a mathematical model for controlling flow separation in rocket nozzles.

experiences:
    title: Professional Experience
    info:
      # Mirrors the CV sent to GlobalFoundries (resume/, tag sent/globalfoundries-2026-10).
      # Gimbal and weather bullets stay qualitative: facts.tex has no number for the
      # comparison with the client's incumbent estimate, and the cost-estimation figures
      # (83.7% / 6.2%) are unreproducible, so they are not published.
      - role: Data Scientist
        time: Oct 2024 - Present
        company: DLR — Deutsches Zentrum für Luft- und Raumfahrt, Jena, Germany
        details: |
            - Lead technical contributor on three industry-funded projects (precision optics, time-series
              forecasting, weather-data quality): requirements, proposals, validation, and technical
              handover to the client.
            - Digitized process planning and cost estimation for a precision-optics manufacturer:
              classifiers predict which manufacturing steps a lens needs (recall-based thresholds,
              calibration), and cost estimates carry prediction intervals that flag low-confidence cases.
            - ML contributor on an aviation-client project: built a computer-vision regression model that
              estimates the residual compressive strength of impact-damaged composites from ultrasonic
              D-scans, as a feasibility study toward fewer destructive coupon tests.
            - Forecast short-horizon flight-attitude IMU data to improve gimbal stabilization; benchmarked
              LSTM, N-HiTS, TimesNet, and PatchTST and improved on the existing Kalman-filtered IMU estimate.
            - Built a time-series anomaly detector for weather-sensor data from sensor boxes on flights,
              covering data-quality checks and anomalous-weather detection, with a FastAPI/Streamlit
              operator view.
            - Run recurring hands-on deep-learning workshops for 50+ colleagues across DLR institutes;
              supervise student projects and advise colleagues from other engineering fields on applying ML.

      - role: Machine Learning Intern
        time: Oct 2023 - May 2024
        company: Porsche AG, Weissach, Germany
        details: |
            - Built and tested a proof of concept on Porsche UI for a context-aware in-car recommender with
              Porsche digital and engineering teams: **83% mean top-3 accuracy** across six
              leave-one-user-out evaluations before user-specific fine-tuning. Published at ACM
              AutomotiveUI 2024 (Best Work-in-Progress Award).
            - Analyzed CAN-bus time series, interaction histories, and driving context to uncover how
              drivers use the in-car UI in different driving situations.

      - role: Machine Learning Intern
        time: Apr 2023 - Sep 2023
        company: DLR — Deutsches Zentrum für Luft- und Raumfahrt, Stade, Germany
        details: |
            - Sole ML contributor on a project for an aviation client: developed and deployed a prototype
              that locates vacuum-bag leaks in aircraft-composite manufacturing from flow-rate sensor data,
              without interrupting or modifying the production line ([DLR eLib](https://elib.dlr.de/199967/)).
            - Extended it to multiple leaks, added uncertainty estimates that flag low-confidence
              predictions, and reduced localization error by more than **12%** by encoding the sensor
              layout (evaluated on held-out leaks).

      - role: Associate Product Manager — Technical
        time: Sep 2017 - Aug 2021
        company: Kalkitech, Kochi, India
        details: |
            - Led cross-functional delivery of the Eltrix asset-management platform across 15+ client
              accounts in Europe, Asia, and the Middle East; turned plant-operator requirements into
              product specifications.
            - Built anomaly detection for boiler-tube and condenser leakage in thermal power plants, plus
              degradation models that turned sensor data into planned maintenance windows.
            - Applied **ASME, EPRI, and HEI** standards to plant-performance models; delivered Grafana and
              Power BI dashboards for near-real-time KPI monitoring.

      - role: Earlier experience and breaks
        details: |
            Sabbatical, travel in India (Jun - Sep 2024); Assistant System Engineer Trainee, Tata
            Consultancy Services (Mar - Aug 2017); sabbatical (Aug 2016 - Feb 2017); Data Analyst,
            Ernst & Young (Jun - Jul 2016).

