# does not already say.
projects:
    title: Open Source & Public Code
    assignments:
      - title: "TEDM — Time Series Forecasting with Elucidated Diffusion Models"
        link: https://gitlab.com/dlr-dw/tedm
        tagline: >
          Official implementation of the ICLR 2026 paper: diffusion-based multivariate forecasting
          on eleven public benchmarks.

      - title: "local-VQA-tool — on-device visual question answering"
        link: https://github.com/sreeragvn/local-VQA-tool
        tagline: >
          Vision-language models running entirely on CPU; every backend refuses non-loopback
          endpoints, so images never leave the machine.

