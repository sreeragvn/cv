career-profile:
    title: Summary
    summary: |
      Data Scientist delivering end-to-end machine-learning projects for industrial clients, working
      from sensor, telemetry, CAN-bus, manufacturing, and inspection data across high-precision optics,
      time series forecasting, UI, and airborne weather-data quality. Takes ambiguous client problems from
      requirements and proposal development through reproducible modeling, validation, and technical handover. Combines
      three years of applied ML in forecasting, predictive maintenance, and computer vision with four
      years of client-facing technical product management and a mechanical-engineering background.
      Co-author of an **ICLR 2026** paper.

education:
    title: Education
    info:
      - degree: M.Sc. in Computational Sciences in Engineering
        university: TU Braunschweig
        time: Oct 2021 - May 2024
        details: |
          - Final grade 1.4 on the German scale (1.0 = best), top 4% of the graduating class, and
            Deutschlandstipendium recipient; focus on pattern recognition, scientific machine learning,
            uncertainty quantification, numerical methods, and optimization.
      - degree: B.Tech in Mechanical Engineering
        university: University of Kerala
        time: Aug 2012 - Apr 2016
        details: |
          - Bachelor's thesis conducted at ISRO on controlling flow separation in rocket nozzles.

experiences:
    title: Professional Experience
    info:
      # Public claims are limited to the verified facts in resume/facts.tex and
      # current CV text. The weather project and all unresolved CV alternatives
      # remain intentionally undescribed.
      - role: Data Scientist
        time: Oct 2024 - Present
        company: DLR — Deutsches Zentrum für Luft- und Raumfahrt, Jena, Germany
        details: |
            - Technical lead on three industry-funded projects in precision optics, time series forecasting, and
              airborne weather-data quality, owning requirements, proposals, validation planning, and technical
              handover to client stakeholders. Standardized delivery through config-driven experiments,
              tracked runs, data fingerprints, seeded splits, and 400+ automated tests.
            - Developed a feasibility prototype for automated process-step prediction in precision-lens
              manufacturing using 909 lens sides from 458 physical lenses; achieved **0.90 micro F1** and
              **0.81 macro F1** across 26 process decisions under nested lens-grouped cross-validation.
            - Built a cost-estimation pipeline joining JSON/SVG product specifications with
              manufacturing-routing records for 909 lens sides from 458 lenses; compared six model
              families under repeated nested lens-grouped validation, placing **83.7%** of estimates within
              ±20% while limiting severe underestimation to **6.2%**.
            - As the ML contributor to an aviation-client project, developed a computer-vision regression
              model estimating the residual compressive strength of impact-damaged composites from
              ultrasonic D-scans, supporting a feasibility study toward reducing destructive coupon tests.
            - Design and run recurring hands-on deep-learning workshops for 50+ colleagues across DLR
              institutes; supervise student projects.

      - role: Machine Learning Intern
        time: Oct 2023 - May 2024
        company: Porsche AG, Weissach, Germany
        details: |
            - Led the end-to-end ML proof of concept for a context-aware in-car recommender with Porsche
              UX and engineering teams, achieving **83% mean top-3 accuracy** across six leave-one-user-out
              evaluations before user-specific fine-tuning; published at ACM AutomotiveUI 2024 (Best
              Work-in-Progress Award).
            - Modeled next-action intent from CAN-bus time series, interaction histories, and temporal,
              route, and driving context; designed a transformer combining heterogeneous inputs and adapted
              SimCLR with domain-specific augmentations to learn from sparse behavioral data.

      - role: Machine Learning Intern
        time: Apr 2023 - Sep 2023
        company: DLR — Deutsches Zentrum für Luft- und Raumfahrt, Stade, Germany
        details: |
            - Sole ML contributor on an aviation-client project, developing and internally deploying a DLR
              prototype that localized vacuum-bag leaks in aircraft-composite autoclave manufacturing from
              flow-rate sensor data, from data acquisition through model validation and technical delivery
              ([DLR eLib](https://elib.dlr.de/199967/)).
            - Extended the method from single- to multi-leak localization, added per-prediction uncertainty
              estimates to flag low-confidence cases, and reduced localization error by more than **12%**
              relative to an otherwise identical unconstrained baseline by encoding sensor-layout geometry,
              evaluated on held-out leak cases.

      - role: Associate Product Manager — Technical
        time: Sep 2017 - Aug 2021
        company: Kalkitech, Kochi, India
        details: |
            - Led cross-functional delivery of the Eltrix asset-management platform across 15+
              multi-site client accounts in Europe, Asia, and the Middle East, translating
              plant-operator requirements into product specifications and coordinating engineering,
              business, and client teams from discovery through delivery.
            - Built thermodynamic and statistical degradation models from plant sensor data for real-time
              performance and deterioration monitoring, including anomaly detection for **boiler tube bursts**
              or condenser leakage, helping thermal power-plant clients move from reactive repair to planned
              preventive maintenance.
            - Applied **ASME, EPRI, and HEI** standards to develop plant-performance models and diagnostics,
              and delivered Grafana and Power BI dashboards providing operators and managers with
              near-real-time KPI visibility across client sites.

      - role: Earlier
        time: 2016 - 2017
        company: Tata Consultancy Services · Ernst & Young, India
        details: |
            - Assistant System Engineer Trainee at Tata Consultancy Services (2017), contributing to
              conversation design for an office-assistant application; Data Analyst at Ernst & Young (2016).

# Public code only. Client work (optics, gimbal, weather) is deliberately absent:
# it cannot be linked, and describing unlinkable work here adds nothing the CV
# does not already say.
projects:
    title: Open Source & Public Code
    assignments:
      - title: "TEDM — Time Series Forecasting with Elucidated Diffusion Models"
        link: https://gitlab.com/dlr-dw/tedm
        tagline: >
          Official implementation of the ICLR 2026 paper. Diffusion-based multivariate forecasting,
          evaluated across eleven public benchmark datasets.

      - title: "local-VQA-tool — on-device visual question answering"
        link: https://github.com/sreeragvn/local-VQA-tool
        tagline: >
          Open-weight vision-language models running entirely on CPU. Every backend asserts a loopback
          endpoint and refuses to start otherwise, so images never leave the machine.

