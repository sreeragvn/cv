career-profile:
    title: Career Profile
    summary: |
      Data Scientist delivering industry-funded ML projects end-to-end for manufacturing clients in
      high-precision optics, gimbal systems and weather forecasting — owning each project from
      requirement scoping and proposal writing through model development to client handover, and
      presenting results directly to client management. Mechanical engineer by training, with three
      years in applied ML on top of four years of client-facing technical product management for
      industrial asset-management software. Co-author on an **ICLR 2026** paper.

education:
    title: Education
    info:
      - degree: M.Sc. in Computational Sciences in Engineering
        university: TU Braunschweig
        time: Oct 2021 - May 2024
        details: |
          - Final grade 1.4 (German scale, 1.0 = best) — top 4% of the graduating class.
          - Recipient of the Deutschlandstipendium.
          - Focus: pattern recognition, scientific machine learning, uncertainty quantification,
          continuous optimization for data science.
      - degree: B.Tech in Mechanical Engineering
        university: University of Kerala
        time: Aug 2012 - Apr 2016
        details: |
          - First-author publication on flow-separation control in rocket nozzles
          (Materials Today: Proceedings), from a bachelor thesis at ISRO.
          - Top 1% in the KEAM state engineering entrance exam (106,071 candidates).

experiences:
    title: Experiences
    info:
      # Accuracy constraints mirrored from the PDF: "deployed" is used ONLY for the
      # DLR Stade CFRP prototype — the optics system is delivered, not running in
      # the client's live workflow. The aircraft-composite work is internal DLR and
      # is never described as a client engagement. No client is named.
      - role: Data Scientist
        time: Oct 2024 - Present
        company: DLR — Deutsches Zentrum für Luft- und Raumfahrt, Jena, Germany
        details: |
            - Technical lead on three industry-funded client projects — high-precision optics
              manufacturing, gimbal systems and weather forecasting — plus one internal DLR project:
              scoping requirements with the client, co-writing project proposals, building the models,
              and presenting results and trade-offs to client management.
            - Built and delivered the client's first automated process-planning and cost-estimation
              system for high-precision lens manufacturing, where quoting previously had no systematic
              method: predicts the required production steps (macro-averaged across 26 process types:
              0.92 balanced accuracy, 0.72 F1) and the resulting cost to a median 10% error, on a
              grouped split that stops near-identical lenses leaking between folds, with
              underprediction penalised above overprediction to keep quotes commercially safe.
            - Built the upstream data platform end to end — parsing 8,163 raw specification files
              (JSON, SVG, KAD) into 236 validated geometry, tolerance and material features with
              cross-source consistency checks.
            - Benchmarked five forecasting architectures (LSTM, N-HiTS, TimesNet, PatchTST,
              iTransformer) on 9-channel gimbal telemetry, halving prediction error against the LSTM
              baseline; forecasting and anomaly-detection work for the gimbal and weather clients is
              ongoing.
            - Built a computer vision model predicting the residual compressive strength of
              impact-damaged aircraft composite structures to within 5% from ultrasonic D-scans,
              replacing destructive coupon testing.
            - Ship client work as tested, reproducible software: config-driven experiments with
              tracked runs, dataset fingerprinting and seeded splits, 400+ automated tests and
              enforced lint/type checks on the core modelling framework.
            - Co-authored TEDM, a diffusion-based time-series forecasting model, published at ICLR 2026.
            - Designed and ran a recurring hands-on deep-learning workshop series for 50+ colleagues
              across DLR institutes; supervises students on project work.

      - role: Machine Learning Intern
        time: Oct 2023 - May 2024
        company: Porsche AG, Weissach, Germany
        details: |
            - Delivered a context-aware infotainment recommender as a proof of concept with Porsche's
              in-car UX and engineering teams, reaching >84% top-3 accuracy and recall for previously
              unseen drivers after fine-tuning; published at ACM AutomotiveUI '24 (Best
              Work-in-Progress Award).
            - Analyzed driver–infotainment interaction data to identify which features drivers actually
              use in which contexts — time of day, route type, driving conditions — to inform UI
              simplification decisions.
            - Learned usable representations from sparse interaction data by adapting self-supervised
              contrastive learning (SimCLR) with custom input augmentations.

      - role: Machine Learning Intern
        time: Apr 2023 - Sep 2023
        company: DLR — Deutsches Zentrum für Luft- und Raumfahrt, Stade, Germany
        details: |
            - Built and deployed an internal DLR prototype locating vacuum-bag leaks during autoclave
              manufacturing of large aircraft composite parts — previously a manual expert search that
              delayed production — owning it end to end from sensor data acquisition through to deployment.
            - Extended the model from single- to multi-leak localization and attached calibrated
              confidence to every prediction, so operators know when to trust the result.
            - Improved localization accuracy by >12% over the same architecture without equivariance
              constraints, by encoding the geometry of the sensor layout directly into the model.

      - role: Associate Product Manager — Technical
        time: Sep 2017 - Aug 2021
        company: Kalkitech, Kochi, India
        details: |
            - Led cross-functional delivery of the Eltrix asset-management platform across 15+
              multi-site client accounts in Europe, Asia and the Middle East, translating plant
              operator requirements into product specifications for engineering, business and
              client teams.
            - Built thermodynamic and statistical models detecting equipment degradation from plant
              sensor data and generating maintenance schedules, moving thermal power plant clients
              from reactive repair to planned preventive maintenance.
            - Applied ASME, EPRI and HEI performance standards to build plant performance models and
              diagnostics that improved asset efficiency and lowered operating cost.
            - Built Grafana and Power BI dashboards tracking plant KPIs, giving operators and managers
              near-real-time visibility across sites.

      - role: Earlier
        time: 2016 - 2017
        company: Tata Consultancy Services · Ernst & Young, India
        details: |
            - Assistant System Engineer Trainee, Tata Consultancy Services (2017).
            - Data Analyst, Ernst & Young (2016).

# Public code only. Client work (optics, gimbal, weather) is deliberately absent:
# it cannot be linked, and describing unlinkable work here adds nothing the CV
# does not already say.
projects:
    title: Open Source & Public Code
    assignments:
      - title: "TEDM — Time Series Forecasting with Elucidated Diffusion Models"
        link: https://gitlab.com/dlr-dw/tedm
        tagline: >
          Official implementation of the ICLR 2026 paper. Diffusion-based multivariate forecasting,
          evaluated across eleven public benchmark datasets.

      - title: "local-VQA-tool — on-device visual question answering"
        link: https://github.com/sreeragvn/local-VQA-tool
        tagline: >
          Open-weight vision-language models running entirely on CPU. Every backend asserts a loopback
          endpoint and refuses to start otherwise, so images never leave the machine.

